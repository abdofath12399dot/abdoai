<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AbdoAi</title>
<meta name="application-name" content="AbdoAi"><meta name="apple-mobile-web-app-title" content="AbdoAi"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="theme-color" content="#111111">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f4f1ea;color:#1c1c1c;display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;border-bottom:1px solid #ddd}
header b{font-size:18px}
button{font:inherit;border:0;border-radius:10px;padding:8px 14px;background:#1c1c1c;color:#fff;cursor:pointer}
button.ghost{background:#eee;color:#1c1c1c}
button:disabled{opacity:.5}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;line-height:1.5;word-wrap:break-word}
.u{align-self:flex-end;background:#1c1c1c;color:#fff}
.a{white-space:normal;line-height:1.75;align-self:flex-start;background:#fff;border:1px solid #e2ddd0}
.a p{margin:0 0 .85em}.a>*:last-child{margin-bottom:0}.a ul,.a ol{margin:0 0 .85em;padding-inline-start:1.5em}.a li{margin-bottom:.35em}.a h3,.a h4{margin:.4em 0 .5em;font-size:1.05em}.a pre{background:#f4f1ea;border-radius:8px;padding:8px;overflow-x:auto;white-space:pre;direction:ltr;text-align:left;margin:0 0 .85em}.a code{background:#f4f1ea;border-radius:4px;padding:0 4px;direction:ltr;unicode-bidi:isolate}.a pre code{background:none;padding:0}
.e{align-self:center;background:#fde8e8;color:#8a1c1c;font-size:14px}
form{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #ddd}
textarea{flex:1;font:inherit;border:1px solid #ccc;border-radius:12px;padding:10px;resize:none;max-height:140px}
#setup{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
#setup .box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
#setup input,#setup select{font:inherit;padding:9px;border:1px solid #ccc;border-radius:10px;width:100%}
#setup small{color:#555;line-height:1.5}
</style>
</head>
<body>
<header><b>AbdoAi</b><span><button class="ghost" id="clear">New chat</button> <button class="ghost" id="cfg">Settings</button></span></header>
<div id="chat"></div>
<form id="f"><textarea id="t" rows="1" dir="auto" placeholder="Ask anything..."></textarea><button id="send">Send</button></form>
<div id="setup"><div class="box">
<b>Settings</b>
<label>Provider<select id="prov"><option value="gemini">Google Gemini (free tier available)</option><option value="openai">OpenAI</option></select></label>
<label>API key<input id="key" type="password" autocomplete="off" placeholder="Paste your key"></label>
<label>Model<input id="model"></label>
<small id="hint"></small>
<small>The key is saved only in this browser on this device. It is sent only to the provider you pick.</small>
<button id="save">Save</button>
</div></div>
<script>
const $=id=>document.getElementById(id);
const DEF={gemini:{model:"gemini-3.5-flash-lite",hint:"Get a key at aistudio.google.com/apikey (free tier available; Google may use free-tier chats to improve its products)"},openai:{model:"gpt-6-luna",hint:"Get a key at platform.openai.com/api-keys (needs billing credit)"}};
const SYSTEM="You are a helpful, general-purpose assistant. Answer in the same language the user writes in (including Egyptian Arabic).";
let cfg=JSON.parse(localStorage.getItem("myai.cfg")||"null")||{prov:"gemini",key:"",model:DEF.gemini.model};
let hist=JSON.parse(localStorage.getItem("myai.hist")||"[]");
function save(){localStorage.setItem("myai.hist",JSON.stringify(hist))}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inl(t){return esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,"$1<em>$2</em>")}
function md(src){
  const out=[];const L=src.replace(/\r/g,"").split("\n");let i=0;
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push("<pre><code>"+esc(b.join("\n"))+"</code></pre>");continue}
    if(!l.trim()){i++;continue}
    let m;
    if(m=l.match(/^#{1,6}\s+(.*)/)){out.push("<h3>"+inl(m[1])+"</h3>");i++;continue}
    if(/^\s*[*\-+]\s+/.test(l)){const it=[];while(i<L.length&&/^\s*[*\-+]\s+/.test(L[i]))it.push("<li>"+inl(L[i++].replace(/^\s*[*\-+]\s+/,""))+"</li>");out.push("<ul>"+it.join("")+"</ul>");continue}
    if(/^\s*\d+[.)]\s+/.test(l)){const it=[];while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i]))it.push("<li>"+inl(L[i++].replace(/^\s*\d+[.)]\s+/,""))+"</li>");out.push("<ol>"+it.join("")+"</ol>");continue}
    const p=[];while(i<L.length&&L[i].trim()&&!/^```|^#{1,6}\s|^\s*([*\-+]|\d+[.)])\s+/.test(L[i]))p.push(inl(L[i++]));
    out.push("<p>"+p.join("<br>")+"</p>");
  }
  return out.join("");
}
function add(cls,text){const d=document.createElement("div");d.className="m "+cls;d.dir="auto";if(cls==="a"&&text!=="..."&&text!=="Hi! Ask me anything.")d.innerHTML=md(text);else d.textContent=text;$("chat").appendChild(d);$("chat").scrollTop=1e9;return d}
function render(){$("chat").innerHTML="";hist.forEach(m=>add(m.role==="user"?"u":"a",m.text));if(!hist.length)add("a","Hi! Ask me anything.")}
function openCfg(){$("prov").value=cfg.prov;$("key").value=cfg.key;$("model").value=cfg.model;$("hint").textContent=DEF[cfg.prov].hint;$("setup").style.display="flex"}
$("prov").onchange=()=>{const p=$("prov").value;$("model").value=DEF[p].model;$("hint").textContent=DEF[p].hint};
$("cfg").onclick=openCfg;
$("save").onclick=()=>{cfg={prov:$("prov").value,key:$("key").value.trim(),model:$("model").value.trim()||DEF[$("prov").value].model};localStorage.setItem("myai.cfg",JSON.stringify(cfg));$("setup").style.display="none"};
$("clear").onclick=()=>{hist=[];save();render()};
async function ask(){
  if(cfg.prov==="gemini"){
    const chain=[cfg.model,"gemini-3.5-flash-lite","gemini-3.1-flash-lite"].filter((m,i,a)=>m&&a.indexOf(m)===i);
    let last;
    for(const model of chain){
      const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":cfg.key},body:JSON.stringify({system_instruction:{parts:[{text:SYSTEM}]},contents:hist.map(m=>({role:m.role==="user"?"user":"model",parts:[{text:m.text}]}))})});
      const j=await r.json();
      if(r.ok)return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("")||"(empty reply)";
      const msg=j.error?.message||String(r.status);
      last=new Error(msg);
      if(![429,500,503,504].includes(r.status)&&!/high demand|overloaded|unavailable|try again/i.test(msg))throw last;
    }
    throw last;
  }
  const r=await fetch("https://api.openai.com/v1/responses",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},body:JSON.stringify({model:cfg.model,instructions:SYSTEM,input:hist.map(m=>({role:m.role==="user"?"user":"assistant",content:m.text}))})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
  if(j.output_text)return j.output_text;
  return (j.output||[]).flatMap(o=>o.content||[]).map(c=>c.text||"").join("")||"(empty reply)";
}
$("f").onsubmit=async e=>{
  e.preventDefault();const text=$("t").value.trim();if(!text)return;
  if(!cfg.key){openCfg();return}
  $("t").value="";hist.push({role:"user",text});save();render();
  const w=add("a","...");$("send").disabled=true;
  try{const out=await ask();hist.push({role:"model",text:out});save();render()}
  catch(err){w.remove();add("e","Error: "+err.message)}
  $("send").disabled=false;$("t").focus();
};
$("t").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!/Android|iPhone|iPad/.test(navigator.userAgent)){e.preventDefault();$("f").requestSubmit()}});
render();if(!cfg.key)openCfg();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js");
</script>
</body></html>
